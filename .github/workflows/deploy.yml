name: Deploy to GitHub Pages

# The game lives on Cloudflare now (cloudflare.yml). The old GitHub Pages
# address stays up only to send players there with their records: it serves
# bridge/index.html, pointed at the repository variable NEW_ORIGIN
# (e.g. https://example.com), on every path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEW_ORIGIN: ${{ vars.NEW_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the bridge at the new address
        run: |
          if [ -z "$NEW_ORIGIN" ]; then
            echo "::error::Set the repository variable NEW_ORIGIN (e.g. https://example.com) first."
            exit 1
          fi
          mkdir -p _site
          sed "s#__NEW_ORIGIN__#${NEW_ORIGIN%/}#g" bridge/index.html > _site/index.html
          # Any old deep link lands on the bridge too.
          cp _site/index.html _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
